<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختيار الموضوع</title>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #bbdefb);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }

    h1 {
      color: #0d47a1;
      margin-bottom: 20px;
      text-align: center;
    }

    form {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 600px;
    }

    label {
      font-weight: bold;
      color: #0d47a1;
      margin-top: 10px; /* Added for spacing */
      display: block; /* Ensures label takes full width */
    }

    input[type="text"] { /* Specificity for text inputs */
      width: 100%;
      margin: 8px 0 15px;
      padding: 10px;
      border: 1px solid #90caf9;
      border-radius: 8px;
      font-size: 1em;
      box-sizing: border-box; /* Ensures padding doesn't expand width */
    }

    #searchTopic, #customTopicInput { /* Apply styling to custom topic input */
      margin-bottom: 15px;
    }

    .topics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 20px; /* Added spacing below topics */
    }

    .topic-card {
      background: #f5f5f5;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .topic-card:hover:not(.disabled) { /* Hover effect only for non-disabled cards */
      background: #bbdefb;
    }

    .topic-card.selected {
      background: #2196f3;
      color: white;
      font-weight: bold;
    }

    .topic-card.disabled { /* Style for taken/disabled topics */
      background: #e0e0e0;
      color: #757575;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    button {
      background: #0d47a1;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1em;
      cursor: pointer;
      width: 100%; /* Make button full width */
      margin-top: 20px; /* Added spacing above button */
    }

    button:hover:not(:disabled) { /* Hover effect only for non-disabled button */
      background: #1565c0;
    }

    button:disabled { /* Style for disabled button */
      background: #90caf9;
      cursor: not-allowed;
    }

    @media (max-width: 768px) {
      form { width: 100%; }
      h1 { font-size: 1.6em; }
    }
  </style>
</head>
<body>
  <h1>📚 اختيار الموضوع</h1>
  <form id="studentForm">
    <label for="firstName">الاسم:</label>
    <input type="text" id="firstName" required="" placeholder="أدخل اسمك">

    <label for="lastName">اللقب:</label>
    <input type="text" id="lastName" required="" placeholder="أدخل لقبك">

    <label for="searchTopic">ابحث في المواضيع المقترحة:</label>
    <input type="text" id="searchTopic" placeholder="ابحث في المواضيع...">

    <div class="topics" id="topicsContainer"></div>

    <label for="customTopicInput">أو أدخل موضوعك الخاص (لا يمكنك اختيار موضوع مقترح مع هذا):</label>
    <input type="text" id="customTopicInput" placeholder="أدخل موضوعًا جديدًا هنا...">

    <button type="submit">تأكيد الاختيار ✅</button>
  </form>

  <script>
    const topics = [
      "الذات والوعي",
      "رحلتك الخاصة: كيف تكتشف نفسك قبل أن تختار طريقك؟",
      "من الفوضى إلى التركيز: فن إدارة انتباهك في زمن التشويش",
      "الذكاء العاطفي… كيف تفهم قلبك قبل أن تحاول فهم الآخرين؟",
      "القيم الشخصية: البوصلة الخفية التي تقود قراراتك",
      "بين الشغف والواقعية: كيف تختار مسارك دون أن تندم؟",
      "فن الهدوء الذكي: كيف تكون ثابتًا في عالم متسارع؟",
      "لغة الجسد الخفية: كيف “تتحدث” دون أن تنطق؟",
      "التأثير بدون سلطة: كيف تقود الآخرين بأسلوبك فقط؟",
      "كيف تبدأ محادثة تغيّر حياتك؟",
      "الكاريزما… مهارة أم طبيعة؟ كيف تبني حضورك بثقة؟",
      "الذكاء الاجتماعي في العلاقات الجامعية والمهنية",
      "فن الإقناع: كيف تزرع فكرة في ذهن شخص آخر؟",
      "كيف تولد الأفكار العظيمة؟ (تقنيات التفكير الإبداعي)",
      "من فكرة إلى تأثير: كيف تحوّل حلمك إلى مشروع يخدم الآخرين؟",
      "الريادة الهادفة: أن تربح وتُحدث فرقًا في الوقت نفسه",
      "التجارة الإلكترونية والذكاء الاصطناعي: فرص جيل جديد",
      "العمل الحر: الحرية كخيار مهني حقيقي",
      "الذكاء الاصطناعي والإنسان: من يخدم من؟",
      "كيف تتعامل مع الفشل دون أن تفقد شغفك؟",
      "فن المثابرة: كيف تستمر حين يتوقف الآخرون؟",
      "كيف تتغلب على التسويف دون أن تعتمد على التحفيز؟",
      "العادات الصغيرة تصنع العظمة: قانون 1٪ يوميًا",
      "مواجهة الخوف من التحدث أمام الناس: خطوات عملية",
      "الطالب القائد: كيف تصنع تأثيرًا حقيقيًا داخل الجامعة؟",
      "بين لغتين: كيف تحافظ على هويتك وتتقن لغة العالم؟",
      "الرسول ﷺ كقدوة قيادية وإنسانية في العصر الحديث",
      "القراءة كرحلة وليس هواية: كيف تقرأ لتتغيّر؟",
      "قوة التطوع: أن تكون نافعًا أكثر من أن تكون مشهورًا",
      "جيل المعرفة: كيف تتعلم ذاتيًا وتصبح خبيرًا بدون شهادة؟",
      "من الجامعة إلى العالم: كيف تبدأ قصتك الآن؟"
    ];

    const topicsContainer = document.getElementById('topicsContainer');
    const searchInput = document.getElementById('searchTopic');
    const customTopicInput = document.getElementById('customTopicInput');
    const form = document.getElementById('studentForm');
    let selectedTopic = null;
    let takenTopics = []; // Client-side tracking of taken topics

    // IMPORTANT: Paste your Google Web App URL here
    const webAppUrl = 'https://script.google.com/macros/s/AKfycbyxJPycyBM5IEr2KeUSg_93yDZpIhXdhIoWZdTMuDXoRnKtBFeG05PngI4X8jFHMHEP/exec';

    // *** SERVER-SIDE INTEGRATION CONCEPT ***
    // To truly prevent duplicate selections across all users, you need:
    // 1. A Google Apps Script function that reads all existing topics from your sheet.
    // 2. A separate 'GET' endpoint in your Apps Script that returns this list.
    // 3. Call this endpoint here to populate 'takenTopics' when the page loads.
    // Example:
    /*
    async function fetchTakenTopicsFromServer() {
        try {
            const response = await fetch(webAppUrl + '?action=getTakenTopics'); // Assuming you add ?action=getTakenTopics
            const data = await response.json();
            if (data.result === 'success' && data.topics) {
                takenTopics = data.topics;
                loadTopics(); // Reload topics with disabled ones
            }
        } catch (error) {
            console.error('Error fetching taken topics:', error);
        }
    }
    */
    // Call fetchTakenTopicsFromServer() at the end instead of loadTopics() if implemented

    function disableAllPredefinedTopics() {
      document.querySelectorAll('.topic-card').forEach(c => {
        c.classList.remove('selected');
        selectedTopic = null; // Clear selected predefined topic
      });
    }

    function loadTopics() {
      topicsContainer.innerHTML = '';
      topics.forEach(topic => {
        const card = document.createElement('div');
        card.className = 'topic-card';
        card.textContent = topic;

        if (takenTopics.includes(topic)) { // Check if topic is already taken
            card.classList.add('disabled');
            card.style.cursor = 'not-allowed'; // Explicitly set cursor
            card.removeEventListener('click', null); // Remove click listener if disabled
        } else {
            card.addEventListener('click', () => {
              disableAllPredefinedTopics(); // Deselect any other predefined topic
              customTopicInput.value = ''; // Clear custom input
              card.classList.add('selected');
              selectedTopic = topic;
            });
        }
        topicsContainer.appendChild(card);
      });
    }

    searchInput.addEventListener('input', e => {
      const term = e.target.value.toLowerCase();
      document.querySelectorAll('.topic-card').forEach(card => {
        card.style.display = card.textContent.toLowerCase().includes(term) ? 'block' : 'none';
      });
    });

    customTopicInput.addEventListener('input', () => {
        // If user types in custom topic, deselect any predefined topic
        if (customTopicInput.value.trim() !== '') {
            disableAllPredefinedTopics();
        }
    });

    form.addEventListener('submit', async e => { // Added 'async' keyword
      e.preventDefault();
      
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const customTopic = customTopicInput.value.trim();

      let finalTopic = '';

      if (customTopic !== '') {
        finalTopic = customTopic; // Prioritize custom topic if entered
      } else if (selectedTopic) {
        finalTopic = selectedTopic; // Otherwise, use the selected predefined topic
      }

      if (!finalTopic) {
        alert("يرجى اختيار موضوع من القائمة أو إدخال موضوعك الخاص.");
        return;
      }

      // Check if the chosen topic is already taken (client-side check)
      if (takenTopics.includes(finalTopic)) {
          alert(`الموضوع "${finalTopic}" مأخوذ بالفعل. يرجى اختيار موضوع آخر.`);
          return;
      }

      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = 'جار الإرسال...';

      const dataObject = {
        firstName: firstName,
        lastName: lastName,
        topic: finalTopic
      };

      try { // Use try-catch for async fetch
        const response = await fetch(webAppUrl, { // Use await
          method: 'POST',
          body: JSON.stringify(dataObject),
          headers: {
            'Content-Type': 'text/plain;charset=utf-8',
          },
        });
        const data = await response.json(); // Use await

        if (data.result === 'success') {
          alert("✅ تم الحجز بنجاح!");
          takenTopics.push(finalTopic); // Add to client-side taken topics
          form.reset();
          disableAllPredefinedTopics(); // Deselect all cards
          selectedTopic = null;
          customTopicInput.value = ''; // Clear custom input after successful submission
          loadTopics(); // Reload topics to update disabled cards
        } else {
          // IMPORTANT: Your Google Apps Script should ideally return `result: 'error', message: 'Topic already taken'`
          // if it detects a duplicate topic on the server-side.
          if (data.message && data.message.includes('Topic already taken')) {
              alert(`الموضوع "${finalTopic}" مأخوذ بالفعل. يرجى اختيار موضوع آخر.`);
              takenTopics.push(finalTopic); // Assume it's taken if server confirms
              loadTopics(); // Refresh to disable it
          } else {
              throw new Error(data.message || 'An unknown error occurred.');
          }
        }
      } catch (error) {
        console.error('Error:', error);
        alert("حدث خطأ. يرجى المحاولة مرة أخرى.");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'تأكيد الاختيار ✅';
      }
    });

    loadTopics();
    // If you implement server-side fetching of taken topics, replace loadTopics() with fetchTakenTopicsFromServer()
    // fetchTakenTopicsFromServer(); // Uncomment this line and implement the function
  </script>
</body>
</html>
