<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختيار الموضوع</title>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #bbdefb);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }

    h1 {
      color: #0d47a1;
      margin-bottom: 20px;
      text-align: center;
    }

    form {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 600px;
    }

    label {
      font-weight: bold;
      color: #0d47a1;
      margin-top: 10px;
      display: block;
    }

    input[type="text"] {
      width: 100%;
      margin: 8px 0 15px;
      padding: 10px;
      border: 1px solid #90caf9;
      border-radius: 8px;
      font-size: 1em;
      box-sizing: border-box;
    }

    #searchTopic, #customTopicInput {
      margin-bottom: 15px;
    }

    .topics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 20px;
      min-height: 50px;
    }

    .topic-card {
      background: #f5f5f5;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .topic-card:hover {
      background: #bbdefb;
    }

    .topic-card.selected {
      background: #2196f3;
      color: white;
      font-weight: bold;
    }

    button {
      background: #0d47a1;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1em;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
    }

    button:hover:not(:disabled) {
      background: #1565c0;
    }

    button:disabled {
      background: #90caf9;
      cursor: not-allowed;
    }

    @media (max-width: 768px) {
      form { width: 100%; }
      h1 { font-size: 1.6em; }
    }
  </style>
</head>
<body>
  <h1>📚 اختيار الموضوع</h1>
  <form id="studentForm">
    <label for="firstName">الاسم:</label>
    <input type="text" id="firstName" required="" placeholder="أدخل اسمك">

    <label for="lastName">اللقب:</label>
    <input type="text" id="lastName" required="" placeholder="أدخل لقبك">

    <label for="searchTopic">ابحث في المواضيع المتاحة:</label>
    <input type="text" id="searchTopic" placeholder="ابحث في المواضيع...">

    <div class="topics" id="topicsContainer"></div>
    <div id="noTopicsMessage" style="text-align: center; color: #757575; display: none;">لا توجد مواضيع مقترحة متاحة حاليًا.</div>

    <label for="customTopicInput">أو أدخل موضوعك الخاص (سيتم إلغاء اختيار أي موضوع مقترح):</label>
    <input type="text" id="customTopicInput" placeholder="أدخل موضوعًا جديدًا هنا...">

    <button type="submit">تأكيد الاختيار ✅</button>
  </form>

  <script>
    const allPredefinedTopics = [ // Original list of all topics
      "الذات والوعي",
      "رحلتك الخاصة: كيف تكتشف نفسك قبل أن تختار طريقك؟",
      "من الفوضى إلى التركيز: فن إدارة انتباهك في زمن التشويش",
      "الذكاء العاطفي… كيف تفهم قلبك قبل أن تحاول فهم الآخرين؟",
      "القيم الشخصية: البوصلة الخفية التي تقود قراراتك",
      "بين الشغف والواقعية: كيف تختار مسارك دون أن تندم؟",
      "فن الهدوء الذكي: كيف تكون ثابتًا في عالم متسارع؟",
      "لغة الجسد الخفية: كيف “تتحدث” دون أن تنطق؟",
      "التأثير بدون سلطة: كيف تقود الآخرين بأسلوبك فقط؟",
      "كيف تبدأ محادثة تغيّر حياتك؟",
      "الكاريزما… مهارة أم طبيعة؟ كيف تبني حضورك بثقة؟",
      "الذكاء الاجتماعي في العلاقات الجامعية والمهنية",
      "فن الإقناع: كيف تزرع فكرة في ذهن شخص آخر؟",
      "كيف تولد الأفكار العظيمة؟ (تقنيات التفكير الإبداعي)",
      "من فكرة إلى تأثير: كيف تحوّل حلمك إلى مشروع يخدم الآخرين؟",
      "الريادة الهادفة: أن تربح وتُحدث فرقًا في الوقت نفسه",
      "التجارة الإلكترونية والذكاء الاصطناعي: فرص جيل جديد",
      "العمل الحر: الحرية كخيار مهني حقيقي",
      "الذكاء الاصطناعي والإنسان: من يخدم من؟",
      "كيف تتعامل مع الفشل دون أن تفقد شغفك؟",
      "فن المثابرة: كيف تستمر حين يتوقف الآخرون؟",
      "كيف تتغلب على التسويف دون أن تعتمد على التحفيز؟",
      "العادات الصغيرة تصنع العظمة: قانون 1٪ يوميًا",
      "مواجهة الخوف من التحدث أمام الناس: خطوات عملية",
      "الطالب القائد: كيف تصنع تأثيرًا حقيقيًا داخل الجامعة؟",
      "بين لغتين: كيف تحافظ على هويتك وتتقن لغة العالم؟",
      "الرسول ﷺ كقدوة قيادية وإنسانية في العصر الحديث",
      "القراءة كرحلة وليس هواية: كيف تقرأ لتتغيّر؟",
      "قوة التطوع: أن تكون نافعًا أكثر من أن تكون مشهورًا",
      "جيل المعرفة: كيف تتعلم ذاتيًا وتصبح خبيرًا بدون شهادة؟",
      "من الجامعة إلى العالم: كيف تبدأ قصتك الآن؟"
    ];

    const topicsContainer = document.getElementById('topicsContainer');
    const searchInput = document.getElementById('searchTopic');
    const customTopicInput = document.getElementById('customTopicInput');
    const form = document.getElementById('studentForm');
    const noTopicsMessage = document.getElementById('noTopicsMessage');
    let selectedTopic = null;
    let takenTopics = []; // Client-side tracking of taken topics from server

    // IMPORTANT: Paste your Google Web App URL here
    const webAppUrl = 'https://script.google.com/macros/s/AKfycbyNBy8HU-l7DYPUq3uYdRy3bBc25b5jflqQURU1tBnEeyxp-v_3rTT831zL8fH2gi0L/exec';

    async function fetchTakenTopicsFromServer() {
        try {
            const response = await fetch(webAppUrl + '?action=getTakenTopics');
            const data = await response.json();
            if (data.result === 'success' && Array.isArray(data.topics)) {
                // Ensure unique topics and trim whitespace
                takenTopics = Array.from(new Set(data.topics.map(t => t.toString().trim())));
                loadTopics(); // Now render topics with the fetched taken ones removed
            } else {
                console.error('Failed to fetch taken topics:', data.message || 'Unknown error');
                loadTopics(); // Still load topics even if fetching fails
            }
        } catch (error) {
            console.error('Error fetching taken topics:', error);
            loadTopics(); // Still load topics if there's a network error
        }
    }

    function clearPredefinedTopicSelection() {
      document.querySelectorAll('.topic-card').forEach(c => c.classList.remove('selected'));
      selectedTopic = null; // Clear selected predefined topic
    }

    function loadTopics() {
      topicsContainer.innerHTML = '';
      const availableTopics = allPredefinedTopics.filter(topic => !takenTopics.includes(topic));

      if (availableTopics.length === 0) {
          noTopicsMessage.style.display = 'block';
      } else {
          noTopicsMessage.style.display = 'none';
      }

      availableTopics.forEach(topic => {
        const card = document.createElement('div');
        card.className = 'topic-card';
        card.textContent = topic;
        
        card.addEventListener('click', () => {
          clearPredefinedTopicSelection(); // Deselect any other predefined topic
          customTopicInput.value = ''; // Clear custom input
          card.classList.add('selected');
          selectedTopic = topic;
        });
        topicsContainer.appendChild(card);
      });

      // After re-rendering, ensure search filter is reapplied
      applySearchFilter(searchInput.value.toLowerCase());
    }

    function applySearchFilter(term) {
      document.querySelectorAll('.topic-card').forEach(card => {
        card.style.display = card.textContent.toLowerCase().includes(term) ? 'block' : 'none';
      });
    }

    searchInput.addEventListener('input', e => {
      applySearchFilter(e.target.value.toLowerCase());
    });

    customTopicInput.addEventListener('input', () => {
        // If user types in custom topic, deselect any predefined topic
        if (customTopicInput.value.trim() !== '') {
            clearPredefinedTopicSelection();
        }
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const customTopic = customTopicInput.value.trim();

      let finalTopic = '';

      if (customTopic !== '') {
        finalTopic = customTopic; // Prioritize custom topic if entered
      } else if (selectedTopic) {
        finalTopic = selectedTopic; // Otherwise, use the selected predefined topic
      }

      // Basic client-side validation
      if (!firstName || !lastName) {
          alert("الرجاء إدخال الاسم واللقب.");
          return;
      }

      if (!finalTopic) {
        alert("يرجى اختيار موضوع من القائمة أو إدخال موضوعك الخاص.");
        return;
      }

      // IMPORTANT: The definitive check for duplicates happens on the server.
      // This client-side check is mostly for immediate feedback on predefined topics
      // and to prevent submitting custom topics that match already-taken predefined ones
      // before hitting the server.
      if (takenTopics.includes(finalTopic)) {
          alert(`الموضوع "${finalTopic}" مأخوذ بالفعل. يرجى اختيار موضوع آخر أو إدخال موضوع فريد.`);
          return; // Stop submission
      }
      
      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = 'جار الإرسال...';

      const dataObject = {
        firstName: firstName,
        lastName: lastName,
        topic: finalTopic
      };

      try {
        const response = await fetch(webAppUrl, {
          method: 'POST',
          body: JSON.stringify(dataObject),
          headers: {
            'Content-Type': 'text/plain;charset=utf-8',
          },
        });
        const data = await response.json();

        if (data.result === 'success') {
          alert("✅ تم الحجز بنجاح!");
          
          // Add the successfully submitted topic to the client-side taken list
          takenTopics.push(finalTopic);
          
          form.reset();
          clearPredefinedTopicSelection(); // Deselect all cards
          selectedTopic = null;
          customTopicInput.value = ''; // Clear custom input after successful submission
          
          loadTopics(); // Re-render topics to remove the newly taken one
        } else {
          // If the server explicitly says the topic is taken (this is the definitive check)
          if (data.message && data.message.includes('Topic already taken')) {
              alert(`الموضوع "${finalTopic}" مأخوذ بالفعل. يرجى اختيار موضوع آخر أو إدخال موضوع فريد.`);
              // If the server confirms it's taken, add it to our client-side list and refresh
              if (!takenTopics.includes(finalTopic)) { // Ensure it's not added twice
                  takenTopics.push(finalTopic);
              }
              loadTopics(); // Refresh to ensure it's removed if it was a predefined one, or for custom topic it'll remain
          } else {
              // General error from server
              throw new Error(data.message || 'An unknown error occurred.');
          }
        }
      } catch (error) {
        console.error('Error:', error);
        alert("حدث خطأ. يرجى المحاولة مرة أخرى.");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'تأكيد الاختيار ✅';
      }
    });

    // Initial load: Fetch taken topics from server, then render.
    fetchTakenTopicsFromServer();
  </script>
</body>
</html>
