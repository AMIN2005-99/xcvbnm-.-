<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختيار الموضوع</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      /* ألوان Electric Xtra Template */
      background: linear-gradient(135deg, #4CAF50, #2196F3); /* أخضر وأزرق ساطع */
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      color: #FFFFFF; /* نص أبيض */
      margin-bottom: 25px;
      text-align: center;
      font-size: 2.2em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    form {
      background: #FFFFFF; /* خلفية بيضاء للنموذج */
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      width: 90%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      font-weight: bold;
      color: #3F51B5; /* أزرق غامق للنصوص */
      font-size: 1.1em;
      margin-bottom: 5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #90CAF9; /* إطار أزرق فاتح */
      border-radius: 10px;
      font-size: 1em;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: #2196F3; /* أزرق ساطع عند التركيز */
      outline: none;
      box-shadow: 0 0 8px rgba(33, 150, 243, 0.4);
    }

    button {
      background: #4CAF50; /* أخضر ساطع للزر */
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      font-size: 1.1em;
      cursor: pointer;
      margin-top: 20px;
      transition: background-color 0.3s ease, transform 0.2s ease;
      align-self: center; /* توسيط الزر */
    }

    button:hover {
      background: #388E3C; /* أخضر أغمق عند التحويم */
      transform: translateY(-2px);
    }

    button:disabled {
      background: #A5D6A7; /* لون باهت للزر المعطل */
      cursor: not-allowed;
    }

    @media (max-width: 768px) {
      form { padding: 25px; }
      h1 { font-size: 1.8em; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <h1>📚 اختيار الموضوع</h1>
  <form id="studentForm">
    <label for="firstName">الاسم:</label>
    <input type="text" id="firstName" required placeholder="أدخل اسمك">

    <label for="lastName">اللقب:</label>
    <input type="text" id="lastName" required placeholder="أدخل لقبك">

    <label for="chosenTopic">الموضوع المختار:</label>
    <input type="text" id="chosenTopic" required placeholder="اكتب موضوعك هنا...">

    <button type="submit">تأكيد الاختيار ✅</button>
  </form>

  <script>
    const form = document.getElementById('studentForm');
    // IMPORTANT: Paste your Google Web App URL here
    const webAppUrl = 'https://script.google.com/macros/s/AKfycbyxJPycyBM5IEr2KeUSg_93yDZpIhXdhIoWZdTMuDXoRnKtBFeG05PngI4X8jFHMHEP/exec'; // تأكد من تحديث هذا الرابط

    form.addEventListener('submit', e => {
      e.preventDefault();
      
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const chosenTopic = document.getElementById('chosenTopic').value.trim(); // الحصول على الموضوع من الحقل الجديد

      if (!chosenTopic) {
        alert("يرجى إدخال موضوع أولاً!");
        return;
      }

      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = 'جار الإرسال...';

      const dataObject = {
        firstName: firstName,
        lastName: lastName,
        topic: chosenTopic // إرسال الموضوع المكتوب مباشرةً
      };

      fetch(webAppUrl, {
        method: 'POST',
        body: JSON.stringify(dataObject),
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
      })
      .then(response => response.json())
      .then(data => {
        if (data.result === 'success') {
          alert("✅ تم الحجز بنجاح!");
          form.reset(); // مسح النموذج بعد الإرسال الناجح
        } else {
          // إذا كان هناك رسالة خطأ محددة من Google Sheets، عرضها
          throw new Error(data.message || 'حدث خطأ غير معروف.');
        }
      })
      .catch(error => {
        console.error('Error:', error);
        alert("حدث خطأ. يرجى المحاولة مرة أخرى. " + error.message);
      })
      .finally(() => {
        submitButton.disabled = false;
        submitButton.textContent = 'تأكيد الاختيار ✅';
      });
    });
  </script>
</body>
</html>
